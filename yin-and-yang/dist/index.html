<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="A quiet place to find your rhythm. Focus timers, tasks, and a little room to breathe.">
  <title>Yin and Yang — A quiet place to focus</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app" aria-label="Yin and Yang study garden">
    <div id="landscape" aria-hidden="true"></div>
    <header class="topbar secondary">
      <div class="top-actions"><button id="focus-mode" class="quiet-button" aria-label="Focus mode" aria-pressed="false"><span class="icon" data-icon="focus"></span><span class="button-text">Focus mode</span></button><button id="fullscreen" class="icon-button" aria-label="Enter fullscreen" title="Enter fullscreen"><span data-icon="expand"></span></button></div>
    </header>
    <section class="sky" aria-label="Study timer">
      <div class="timer-readout">
        <div class="local-clock"><time id="wall-clock"></time></div>
        <button id="edit-duration" type="button" title="Type a duration and press Enter" aria-label="Edit countdown duration"><span id="countdown" role="timer" aria-label="Focus time remaining">25<span>:</span>00</span><sup>✎</sup></button>
        <form id="duration-form" hidden>
          <input id="typed-duration" aria-label="Duration in minutes or minutes and seconds" placeholder="25:00" enterkeyhint="done" required maxlength="6">
          <div class="duration-actions">
            <button type="submit" title="Save duration (Enter)">Set</button>
            <button type="button" id="cancel-duration">Cancel</button>
          </div>
        </form>
      </div>
      <div class="mode-tabs" aria-label="Timer mode"><button data-mode="focus" aria-pressed="true">Focus</button><span>·</span><button data-mode="break" aria-pressed="false">Rest</button></div>
      <div class="timer-actions"><button id="reset-timer" class="icon-button" title="Reset timer" aria-label="Reset timer"><span data-icon="reset"></span></button><button id="toggle-timer" class="start-button"><span data-icon="play"></span><span>Begin focus</span></button><button id="skip-timer" class="icon-button" title="Skip session" aria-label="Skip session"><span data-icon="skip"></span></button></div>
      <div class="sky-task"><span class="tiny-dot"></span><button id="current-task" aria-haspopup="dialog">Add task</button></div>
      <p id="session-status" class="session-status">Settle in. There’s no rush.</p>
    </section>
    <aside id="task-sidebar" class="secondary" aria-labelledby="tasks-heading" hidden>
      <div class="task-sidebar-header">
        <h2 id="tasks-heading">Tasks</h2>
        <button id="sidebar-calendar" type="button" aria-controls="calendar-panel" aria-expanded="false">Calendar</button>
        <button id="sidebar-add-task" type="button" aria-haspopup="dialog">+ Add task</button>
        <button id="close-task-sidebar" class="icon-button" type="button" aria-label="Hide tasks" title="Hide tasks"><span data-icon="close"></span></button>
      </div>
      <div id="task-board"></div>
    </aside>
    <section id="calendar-panel" aria-labelledby="calendar-heading" hidden>
      <header class="calendar-header">
        <div><h2 id="calendar-heading">Calendar</h2><p id="calendar-range" aria-live="polite"></p></div>
        <nav class="calendar-nav" aria-label="Calendar week">
          <button type="button" data-week="previous" aria-label="Previous week">‹</button>
          <button type="button" data-week="today">Today</button>
          <button type="button" data-week="next" aria-label="Next week">›</button>
          <button id="close-calendar" class="icon-button" type="button" aria-label="Close calendar"><span data-icon="close"></span></button>
        </nav>
      </header>
      <p class="calendar-help">Drag tasks or blocks onto a time. Blocks can overlap. For touch or keyboard, set a date and time in the task editor.</p>
      <div id="calendar-task-tray" aria-label="Tasks to schedule" hidden></div>
      <div id="calendar-scroll" tabindex="0" aria-label="Weekly schedule"><div id="calendar-grid"></div></div>
    </section>
    <div id="objects"></div>
    <footer class="bottom-bar secondary"><span id="saved-status" class="saved-status"><span class="tiny-dot"></span>Saved on this device</span></footer>
    <div id="panel-root"></div>
    <div id="task-menu" role="menu" aria-label="Task actions" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
